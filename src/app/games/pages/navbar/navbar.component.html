<mat-toolbar color="primary">
  <div class="logo">
    <img src="logo.png" alt="Your Logo">
  </div>
  <!-- Iterar sobre navItems para botones de navegación -->
  <button *ngFor="let item of navItems" mat-button [routerLink]="item.url">
    {{ item.label }}
  </button>

  <!-- Botón especial para Sign Up -->
  <button mat-stroked-button [routerLink]="signUpUrl">Free Sign Up</button>
</mat-toolbar>

<router-outlet></router-outlet>
