<div class="login-container" style="text-align: center; margin-top: 50px;">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Login</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form>
                <mat-form-field appearance="fill">
                    <mat-label>Usuario</mat-label>
                    <input matInput placeholder="Ingrese su usuario" required>
                </mat-form-field>
                <mat-form-field appearance="fill">
                    <mat-label>Contraseña</mat-label>
                    <input matInput type="password" placeholder="Ingrese su contraseña" required>
                </mat-form-field>
                <button mat-raised-button color="primary" type="submit">Ingresar</button>
            </form>
        </mat-card-content>
        <mat-card-actions>
            <p>¿No tienes una cuenta? <a routerLink="/register">Regístrate aquí</a></p>
        </mat-card-actions>
    </mat-card>
</div>
